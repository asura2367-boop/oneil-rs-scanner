name: Update RS data

on:
  workflow_dispatch:
  schedule:
    - cron: '20 1,5,9 * * 1-5'

concurrency:
  group: kis-data-collection
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_BATCH_SIZE: '20'
      KIS_REQUEST_PAUSE: '0.8'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build RS data
        run: python build_data.py
      - name: Save data
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/kis_daily_universe.csv data/collection_status.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Update RS collection data'
            git push
          fi

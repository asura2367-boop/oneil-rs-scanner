name: Update RS data and investor flow V9

on:
  workflow_dispatch:
  schedule:
    - cron: '30 9 * * 1-5' # 18:30 KST, weekdays (UTC)

permissions:
  contents: write

concurrency:
  group: kis-collectors
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_BATCH_SIZE: '50'
      KIS_FLOW_BATCH_SIZE: '20'
      KIS_REQUEST_PAUSE: '0.8'
      KIS_FLOW_PAUSE: '0.8'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Collect daily prices
        run: python build_data.py
      - name: Save daily prices and status
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/kis_daily_universe.csv data/collection_status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update RS daily prices'
            git pull --rebase origin main
            git push
          fi
      - name: Wait before next KIS token request
        run: sleep 90
      - name: Collect investor flow
        run: python build_investor.py
      - name: Save investor flow
        if: always()
        run: |
          if [ -f data/kis_investor_flow.csv ]; then
            git add data/kis_investor_flow.csv
            if ! git diff --cached --quiet; then
              git commit -m 'Update KIS investor flow'
              git pull --rebase origin main
              git push
            fi
          fi

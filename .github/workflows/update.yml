name: Update RS data and investor flow V9

on:
  workflow_dispatch:
  schedule:
    - cron: '30 9 * * 1-5' # 18:30 KST weekdays

permissions:
  contents: write

concurrency:
  group: kis-collectors
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO }}
      KIS_ACCOUNT_PRODUCT: ${{ secrets.KIS_ACCOUNT_PRODUCT }}
      KIS_TOKEN_CACHE_KEY: ${{ secrets.KIS_TOKEN_CACHE_KEY }}
      LIVE_ENABLED: 'false'
      KIS_ALLOW_ORDER: 'false'
      KIS_BATCH_SIZE: '100'
      KIS_DAILY_REFRESH_LIMIT: '3000'
      KIS_COLLECTION_SECONDS: '1800'
      KIS_FLOW_BATCH_SIZE: '250'
      KIS_REQUEST_PAUSE: '0.8'
      KIS_FLOW_PAUSE: '0.8'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install 'cryptography>=42,<47'
      - name: Collect prices and investor flow with single encrypted-cache token
        run: python collect_shared_token.py
      - name: Commit collected read-only data
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/kis_daily_universe.csv data/collection_status.json data/kis_investor_flow.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Update RS prices and investor flow with shared token'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

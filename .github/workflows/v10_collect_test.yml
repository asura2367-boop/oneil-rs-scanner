name: V10 KIS Data Collection Test (manual, no orders)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kis-collectors
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_BATCH_SIZE: '50'
      KIS_FLOW_BATCH_SIZE: '20'
      KIS_REFRESH_BATCH_SIZE: '5'
      KIS_FLOW_REFRESH_BATCH_SIZE: '3'
      KIS_REQUEST_PAUSE: '0.8'
      KIS_FLOW_PAUSE: '0.8'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Audit existing data before collection
        run: python v10_data_audit.py --output v10_before.json
      - name: Collect daily prices (existing collector)
        run: python build_data.py
      - name: Collect investor flow (existing collector)
        run: |
          sleep 90
          python build_investor.py
      - name: Audit after collection
        if: always()
        run: python v10_data_audit.py --output v10_after.json
      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v10-data-audit
          path: |
            v10_before.json
            v10_after.json
      - name: Commit only collected market data
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/kis_daily_universe.csv data/kis_investor_flow.csv data/collection_status.json
          if git diff --cached --quiet; then
            echo 'No market data changes'
            exit 0
          fi
          git commit -m 'V10 test: update KIS market data only'
          git pull --rebase origin main
          git push origin HEAD:main

name: Oneil V5.5 Evidence Integration (NO ORDERS)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LIVE_ENABLED: 'false'
      KIS_ALLOW_ORDER: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test NO-ORDER evidence gate
        run: python -m unittest discover -s tests -p 'test_oneil_live_v5_5.py' -v
      - name: Evaluate evidence without broker calls
        run: python oneil_live_v5_5.py --report v5_5_report.json
      - uses: actions/upload-artifact@v4
        with:
          name: v5-5-safe-audit
          path: v5_5_report.json
          retention-days: 3

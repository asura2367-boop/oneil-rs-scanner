name: Refresh signed source/test evidence (NO ORDERS)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/oneil_v519_review_evidence.yml', '.github/workflows/oneil_v519_release_attest.yml']
  pull_request:
    paths: ['.github/workflows/oneil_v519_review_evidence.yml', '.github/workflows/oneil_v519_release_attest.yml', 'tests/release-publisher.test.cjs']
  workflow_run:
    workflows: ['V5.19 Integrated Engine (OWNER CONTROLLED)']
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  test-publisher:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node tests/release-publisher.test.cjs
  publish:
    if: github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main')
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/oneil_v519_release_attest.yml
    secrets:
      DASHBOARD_SITE_ACCESS_TOKEN: ${{ secrets.DASHBOARD_SITE_ACCESS_TOKEN }}

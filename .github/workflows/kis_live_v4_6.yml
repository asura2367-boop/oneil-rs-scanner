name: KIS V4.6 RISK GOVERNOR (NO ORDERS)
on:
  workflow_dispatch:
    inputs:
      emergency_halt:
        description: 'Latch emergency stop (cannot be reset by this workflow)'
        type: boolean
        default: false
        required: true
permissions:
  contents: write
concurrency:
  group: kis-v46-risk-state
  cancel-in-progress: false
jobs:
  risk:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LIVE_ENABLED: 'false'
      KIS_ALLOW_ORDER: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test loss rule and halt persistence offline
        run: python -m unittest discover -s tests -p test_kis_live_v4_6.py -v
      - name: Record fail-closed risk decision (NO BROKER CALLS)
        env:
          HALT_REQUESTED: ${{ inputs.emergency_halt }}
        run: |
          if [ "$HALT_REQUESTED" = 'true' ]; then
            python kis_live_v4_6.py --emergency-halt
          else
            python kis_live_v4_6.py
          fi
      - name: Commit only risk state and sanitized report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/live/v4_6_halt.json data/live/v4_6_risk_report.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record V4.6 no-order risk status'
            git push origin HEAD:main
          fi

name: Oneil V5.19 Final Unified Read-only Check (NO ORDERS)
on:
  workflow_dispatch:
    inputs:
      broker_read:
        description: 'Read-only KIS account and indicative power'
        type: boolean
        default: false
      network:
        description: 'KRX/NXT indicative frame diagnostics'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: oneil-v519-final-readonly
  cancel-in-progress: false
jobs:
  final-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LIVE_ENABLED: 'false'
      KIS_ALLOW_ORDER: 'false'
      BROKER_READ: ${{ inputs.broker_read }}
      NETWORK: ${{ inputs.network }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO }}
      KIS_ACCOUNT_PRODUCT: ${{ secrets.KIS_ACCOUNT_PRODUCT }}
      KIS_TOKEN_CACHE_KEY: ${{ secrets.KIS_TOKEN_CACHE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only dependencies
        run: python -m pip install cryptography requests websockets
      - name: All existing and new safety tests
        run: |
          python -m unittest -v test_v519_kis_reconcile.py
          python -m unittest -v tests/test_v519_auth_diag.py
          python -m unittest -v tests/test_v519_token_bootstrap.py
          python -m unittest -v tests/test_v519_pretrade_audit.py
          python -m unittest -v tests/test_v519_loss_history_guard.py
          python -m unittest -v tests/test_v519_final_diagnostic.py
      - name: Clear prior-run evidence
        run: |
          rm -f v5_9_candidates_review.json v5_11_review.json v5_13_review.json \
            v5_19_indicative_power.json v5_19_kis_reconcile.json v5_18_report.json \
            v5_19_loss_history_diagnostic.json v5_19_final_diagnostic.json \
            v5_19_pretrade_audit.json
      - name: Authenticate for current run only
        run: |
          if [ "$BROKER_READ" = 'true' ]; then
            python oneil_v519_token_bootstrap.py --broker-read
          else
            python oneil_v519_token_bootstrap.py
          fi
      - name: Generate review-only candidates
        run: |
          python oneil_live_v5_9.py --output v5_9_candidates_review.json
          python oneil_live_v5_11.py --candidates v5_9_candidates_review.json --output v5_11_review.json
      - name: Read-only KIS account
        run: |
          if [ "$BROKER_READ" = 'true' ]; then
            python oneil_live_v5_13.py --intents v5_11_review.json --output v5_13_review.json --broker-read
          else
            python oneil_live_v5_13.py --intents v5_11_review.json --output v5_13_review.json
          fi
      - name: Read-only indicative buying power
        run: |
          if [ "$BROKER_READ" = 'true' ]; then
            python oneil_v519_broker_power_observe.py --intents v5_11_review.json --output v5_19_indicative_power.json --broker-read
          else
            python oneil_v519_broker_power_observe.py --intents v5_11_review.json --output v5_19_indicative_power.json
          fi
      - name: Reconcile broker observations
        run: python oneil_v519_kis_reconcile.py --intents v5_11_review.json --account v5_13_review.json --buying v5_19_indicative_power.json --output v5_19_kis_reconcile.json
      - name: Read-only quote diagnostics
        run: |
          if [ "$NETWORK" = 'true' ]; then
            python oneil_live_v5_18.py --network --seconds 12 --output v5_18_report.json
          else
            python oneil_live_v5_18.py --output v5_18_report.json
          fi
      - name: Reject unverified baseline and broker order history
        run: python oneil_v519_loss_history_guard.py --output v5_19_loss_history_diagnostic.json
      - name: Consolidate all same-run evidence without authorization
        run: |
          python oneil_v519_final_diagnostic.py --output v5_19_final_diagnostic.json
          python - <<'PY'
          import json
          x=json.load(open('v5_19_final_diagnostic.json',encoding='utf8'))
          assert x['gate']=='DENY' and x['orders_sent']==0
          assert x['approved_order_qty_count']==0
          assert 'EXECUTABLE_QUOTE_UNATTESTED' in x['block_codes']
          assert 'BROKER_ORDER_HISTORY_INDEPENDENCE_UNVERIFIED' in x['block_codes']
          print('FINAL_SAFETY=DENY; orders_sent=0')
          PY
      - name: Upload only sanitized reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v519-final-readonly-diagnostics
          path: |
            v5_19_kis_reconcile.json
            v5_18_report.json
            v5_19_loss_history_diagnostic.json
            v5_19_final_diagnostic.json
          if-no-files-found: warn
          retention-days: 3

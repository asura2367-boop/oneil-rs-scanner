name: Oneil V5.17 Quote Decode Diagnostic (NO ORDERS)
on:
  workflow_dispatch:
    inputs:
      network:
        description: 'Subscribe to real KIS quote WebSocket (read-only)'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: oneil-v5-17-quote-decode
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LIVE_ENABLED: 'false'
      KIS_ALLOW_ORDER: 'false'
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      NETWORK: ${{ inputs.network }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read only libraries
        run: python -m pip install requests websockets
      - name: Offline parser tests
        run: python -m unittest discover -s tests -p 'test_oneil_v5_17.py' -v
      - name: Decode limited quote frames never submit orders
        run: |
          if [ "$NETWORK" = 'true' ]; then
            python oneil_live_v5_17.py --network --seconds 12
          else
            python oneil_live_v5_17.py
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: v5-17-sanitized-no-orders
          path: v5_17_report.json
          retention-days: 3

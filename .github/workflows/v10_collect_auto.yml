name: V10 Extra Market Data Collection (no orders)

on:
  workflow_dispatch:
  # Manual backfill only; automatic confirmed collection stays in update.yml.

permissions:
  contents: write

# Must match update.yml (V9) to prevent simultaneous data writers.
concurrency:
  group: kis-collectors
  cancel-in-progress: false

jobs:
  session:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    uses: ./.github/workflows/kis_live_v4_5_2.yml
    secrets:
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_TOKEN_CACHE_KEY: ${{ secrets.KIS_TOKEN_CACHE_KEY }}
  collect:
    needs: session
    if: always() && (needs.session.result == 'success' || needs.session.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_TOKEN_CACHE_KEY: ${{ secrets.KIS_TOKEN_CACHE_KEY }}
      LIVE_ENABLED: 'false'
      KIS_ALLOW_ORDER: 'false'
      KIS_BATCH_SIZE: '100'
      KIS_DAILY_REFRESH_LIMIT: '3000'
      KIS_COLLECTION_SECONDS: '1800'
      KIS_FLOW_BATCH_SIZE: '250'
      KIS_FLOW_REFRESH_BATCH_SIZE: '3'
      KIS_REQUEST_PAUSE: '0.8'
      KIS_FLOW_PAUSE: '0.8'
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Refresh checkout before collection
        run: git pull --ff-only origin main
      - name: Load latest shared encrypted session (no token issuance)
        if: needs.session.outputs.ready == 'true'
        run: |
          git fetch origin main
          git show FETCH_HEAD:data/live/kis_token_cache.enc.json > data/live/kis_token_cache.enc.json
      - name: Collect confirmed history and flow with one encrypted-cache token
        run: python collect_shared_token.py
      - name: Commit collected read-only data
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/kis_daily_universe.csv data/collection_status.json data/kis_investor_flow.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh confirmed RS history and flow'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

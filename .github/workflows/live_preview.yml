name: Oneil LIVE Safety Preview (NO ORDERS)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      LIVE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify LIVE hard off and generate preview
        run: python live_trade.py --state data/paper/state.json --summary data/paper/paper_summary.json --output data/live/preview.json
      - name: Upload preview artifact (not repository commit)
        uses: actions/upload-artifact@v4
        with:
          name: live-preview
          path: data/live/preview.json

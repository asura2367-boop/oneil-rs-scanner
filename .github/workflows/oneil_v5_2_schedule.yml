name: Oneil V5.2 Scheduled Analysis (NO ORDERS)
on:
  workflow_dispatch:
  schedule:
    - cron: '10 0 * * 1-5'   # 09:10 KST
    - cron: '30 3 * * 1-5'   # 12:30 KST
    - cron: '10 7 * * 1-5'   # 16:10 KST
    - cron: '10 10 * * 1-5'  # 19:10 KST
permissions:
  contents: read
concurrency:
  group: oneil-v5-2-analysis
  cancel-in-progress: false
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LIVE_ENABLED: 'false'
      KIS_ALLOW_ORDER: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline scheduler safety tests
        run: python -m unittest discover -s tests -p 'test_oneil_v5_2_schedule.py' -v
      - name: Respect persisted ON OFF and analyze existing candidate file
        run: python oneil_v5_2_schedule.py --report v5_2_analysis_report.json
      - name: Save sanitized review report
        uses: actions/upload-artifact@v4
        with:
          name: v5-2-no-order-analysis
          path: v5_2_analysis_report.json
          retention-days: 3

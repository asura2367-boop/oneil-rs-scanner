name: Oneil V5.19 KIS Read Only Reconciliation (NO ORDERS)
on:
  workflow_dispatch:
    inputs:
      broker_read:
        description: 'Use temporary token to fetch KIS holdings, unfilled and indicative power (no orders)'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: oneil-v519-kis-read-only
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      LIVE_ENABLED: 'false'
      KIS_ALLOW_ORDER: 'false'
      BROKER_READ: ${{ inputs.broker_read }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO }}
      KIS_ACCOUNT_PRODUCT: ${{ secrets.KIS_ACCOUNT_PRODUCT }}
      KIS_TOKEN_CACHE_KEY: ${{ secrets.KIS_TOKEN_CACHE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install cache diagnostic dependency
        run: python -m pip install cryptography
      - name: Reconciliation and token bootstrap tests
        run: |
          python -m unittest -v test_v519_kis_reconcile.py
          python -m unittest -v tests/test_v519_auth_diag.py
          python -m unittest -v tests/test_v519_token_bootstrap.py
      - name: Safe KIS cache status check (never prints credentials)
        run: python oneil_v519_auth_diag.py
      - name: Bootstrap ephemeral KIS access token (NO ORDERS)
        shell: bash
        run: |
          if [ "$BROKER_READ" = 'true' ]; then
            python oneil_v519_token_bootstrap.py --broker-read
          else
            python oneil_v519_token_bootstrap.py
          fi
      - name: Prepare review-only candidate intents
        shell: bash
        run: |
          rm -f v5_9_candidates_review.json v5_11_review.json
          python oneil_live_v5_9.py --output v5_9_candidates_review.json
          python oneil_live_v5_11.py --candidates v5_9_candidates_review.json --output v5_11_review.json
      - name: Observe KIS account (read only)
        shell: bash
        run: |
          rm -f v5_13_review.json
          if [ "$BROKER_READ" = 'true' ]; then
            python oneil_live_v5_13.py --intents v5_11_review.json --output v5_13_review.json --broker-read
          else
            python oneil_live_v5_13.py --intents v5_11_review.json --output v5_13_review.json
          fi
      - name: Observe indicative KIS buying power (read only)
        shell: bash
        run: |
          rm -f v5_19_indicative_power.json
          if [ "$BROKER_READ" = 'true' ]; then
            python oneil_v519_broker_power_observe.py --intents v5_11_review.json --output v5_19_indicative_power.json --broker-read
          else
            python oneil_v519_broker_power_observe.py --intents v5_11_review.json --output v5_19_indicative_power.json
          fi
      - name: Reconcile same-run evidence and hard DENY
        run: python oneil_v519_kis_reconcile.py --intents v5_11_review.json --account v5_13_review.json --buying v5_19_indicative_power.json --output v5_19_kis_reconcile.json
      - name: Upload sanitized report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v519-kis-readonly-no-orders
          path: v5_19_kis_reconcile.json
          if-no-files-found: warn
          retention-days: 3

name: Publish signed V5.19 test evidence (NO ORDERS)
on:
  workflow_call:
    secrets:
      DASHBOARD_SITE_ACCESS_TOKEN:
        required: true
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  attest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          SITE_ACCESS: ${{ secrets.DASHBOARD_SITE_ACCESS_TOKEN }}
        with:
          script: |
            const crypto = require('crypto');
            const repo = 'asura2367-boop/oneil-rs-scanner';
            if (context.repo.owner+'/'+context.repo.repo!==repo || context.ref!=='refs/heads/main' || !['push','schedule','workflow_dispatch'].includes(context.eventName)) throw Error('EVIDENCE_CONTEXT_INVALID');
            const run=(await github.request('GET /repos/{owner}/{repo}/actions/runs/{run_id}',{...context.repo,run_id:context.runId})).data;
            if(run.head_sha!==context.sha || run.head_branch!=='main' || run.path!=='.github/workflows/oneil_v519_live_engine_review.yml') throw Error('EVIDENCE_RUN_INVALID');
            const jobs=(await github.request('GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}/jobs',{...context.repo,run_id:context.runId,attempt_number:run.run_attempt,per_page:100})).data.jobs;
            const test=jobs.find(j=>j.name==='test');
            if(!test || test.status!=='completed') throw Error('EVIDENCE_TEST_UNFINISHED');
            const files=["oneil_v519_live_engine.py", "v519_pg_ledger.py", "v519_pg_reconcile.py", "v519_cash_policy.py", "oneil_v519_live_runner.py", "oneil_v519_history_observe.py", "oneil_v519_broker_recovery.py", "oneil_v519_order_recovery.py", "kis_buying_power_readonly.py", "kis_safety_v3.py", "oneil_live_v5_9.py", ".github/workflows/oneil_v519_live_engine_review.yml", ".github/workflows/oneil_v519_release_attest.yml", "build_v4b_candidates.py", "quote_collector_v4a.py", "kis_live_v4_5_2.py", ".github/workflows/v4b_candidate_save_auto.yml", "build_data.py", "build_investor.py", "collect_shared_token.py", ".github/workflows/kis_live_v4_5_2.yml", ".github/workflows/update.yml", ".github/workflows/v10_collect_auto.yml", "requirements.txt"];
            const parts=[Buffer.from('oneil-v519-operator-release-v1\0')],source_files={};
            for(const path of files){
             const file=(await github.request('GET /repos/{owner}/{repo}/contents/{path}',{...context.repo,path,ref:context.sha})).data;
             if(file.type!=='file'||file.encoding!=='base64'||file.size>500000)throw Error('EVIDENCE_SOURCE_INVALID');
             const body=Buffer.from(file.content,'base64');
             const blob=crypto.createHash('sha1').update(Buffer.concat([Buffer.from('blob '+body.length+'\0'),body])).digest('hex');
             if(blob!==file.sha)throw Error('EVIDENCE_BLOB_INVALID');source_files[path]=blob;
             parts.push(Buffer.from(path+'\0'),body,Buffer.from('\0'));
            }
            const expected_release=crypto.createHash('sha256').update(Buffer.concat(parts)).digest('hex');
            const observation=jobs.find(j=>j.name==='observe');
            const manifest={schema_version:1,source_commit:context.sha,expected_release,source_files,review_run_id:context.runId,summary:String(context.payload.head_commit?.message||'검증된 엔진 소스').slice(0,1000)};
            const body=JSON.stringify({schema_version:1,manifest,run_attempt:run.run_attempt,test_job_id:test.id,test_status:test.status,test_conclusion:test.conclusion,test_completed_at:test.completed_at,observation_conclusion:observation?.conclusion||'skipped'});
            const digest=crypto.createHash('sha256').update(body).digest('hex');
            const jwt=await core.getIDToken('https://oneil-control-desk.asura2367.chatgpt.site/api/release-evidence#sha256='+digest);
            const response=await fetch('https://oneil-control-desk.asura2367.chatgpt.site/api/release-evidence',{method:'POST',redirect:'manual',headers:{'OAI-Sites-Authorization':'Bearer '+process.env.SITE_ACCESS,'X-Oneil-Release-Attestation':jwt,'Content-Type':'application/json'},body,signal:AbortSignal.timeout(30000)});
            if(!response.ok)throw Error('EVIDENCE_PUBLISH_HTTP_'+response.status);
            core.info('Signed source/test evidence delivered; no orders or approvals changed.');

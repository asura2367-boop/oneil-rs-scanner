name: Publish signed V5.19 test evidence (NO ORDERS)
on:
  workflow_call:
    secrets:
      DASHBOARD_SITE_ACCESS_TOKEN:
        required: true
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  attest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          SITE_ACCESS: ${{ secrets.DASHBOARD_SITE_ACCESS_TOKEN }}
        with:
          script: |
            const crypto = require('crypto');
            const repo = 'asura2367-boop/oneil-rs-scanner';
            if (context.repo.owner+'/'+context.repo.repo!==repo || context.ref!=='refs/heads/main' || !['workflow_run','push'].includes(context.eventName)) throw Error('EVIDENCE_CONTEXT_INVALID');
            let target=Number(context.payload.workflow_run?.id);
            if(context.eventName==='push'){
              const recent=(await github.request('GET /repos/{owner}/{repo}/actions/workflows/{workflow_id}/runs',{...context.repo,workflow_id:399226301,branch:'main',status:'completed',per_page:10})).data.workflow_runs;
              target=recent[0]?.id;
            }
            if(!Number.isSafeInteger(target)||target<1)throw Error('EVIDENCE_TARGET_INVALID');
            const run=(await github.request('GET /repos/{owner}/{repo}/actions/runs/{run_id}',{...context.repo,run_id:target})).data;
            if(!/^[0-9a-f]{40}$/.test(run.head_sha)||run.status!=='completed'||!['push','schedule','workflow_dispatch'].includes(run.event)||run.head_branch!=='main'||run.path!=='.github/workflows/oneil_v519_live_engine_review.yml') throw Error('EVIDENCE_RUN_INVALID');
            const jobs=(await github.request('GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}/jobs',{...context.repo,run_id:target,attempt_number:run.run_attempt,per_page:100})).data.jobs;
            const test=jobs.find(j=>j.name==='test');
            if(!test || test.status!=='completed') throw Error('EVIDENCE_TEST_UNFINISHED');
            const files=["oneil_v519_live_engine.py", "v519_pg_ledger.py", "v519_pg_reconcile.py", "v519_cash_policy.py", "oneil_v519_live_runner.py", "oneil_v519_history_observe.py", "oneil_v519_broker_recovery.py", "oneil_v519_order_recovery.py", "kis_buying_power_readonly.py", "kis_safety_v3.py", "oneil_live_v5_9.py", ".github/workflows/oneil_v519_live_engine_review.yml", "build_v4b_candidates.py", "quote_collector_v4a.py", "kis_live_v4_5_2.py", ".github/workflows/v4b_candidate_save_auto.yml", "build_data.py", "build_investor.py", "collect_shared_token.py", ".github/workflows/kis_live_v4_5_2.yml", ".github/workflows/update.yml", ".github/workflows/v10_collect_auto.yml", "requirements.txt"];
            const parts=[Buffer.from('oneil-v519-operator-release-v1\0')],source_files={};
            for(const path of files){
             const file=(await github.request('GET /repos/{owner}/{repo}/contents/{path}',{...context.repo,path,ref:run.head_sha})).data;
             if(file.type!=='file'||file.encoding!=='base64'||file.size>500000)throw Error('EVIDENCE_SOURCE_INVALID');
             const body=Buffer.from(file.content,'base64');
             const blob=crypto.createHash('sha1').update(Buffer.concat([Buffer.from('blob '+body.length+'\0'),body])).digest('hex');
             if(blob!==file.sha)throw Error('EVIDENCE_BLOB_INVALID');source_files[path]=blob;
             parts.push(Buffer.from(path+'\0'),body,Buffer.from('\0'));
            }
            const expected_release=crypto.createHash('sha256').update(Buffer.concat(parts)).digest('hex');
            const observation=jobs.find(j=>j.name==='observe');
            const manifest={schema_version:1,source_commit:run.head_sha,expected_release,source_files,review_run_id:target,summary:String(context.payload.head_commit?.message||'검증된 엔진 소스').slice(0,1000)};
            const body=JSON.stringify({schema_version:1,manifest,issuer:{run_id:context.runId,run_attempt:Number(process.env.GITHUB_RUN_ATTEMPT),source_commit:context.sha},source_event:run.event,run_status:run.status,workflow_conclusion:run.conclusion,run_attempt:run.run_attempt,test_job_id:test.id,test_status:test.status,test_conclusion:test.conclusion,test_completed_at:test.completed_at,observation_conclusion:observation?.conclusion||'skipped'});
            const digest=crypto.createHash('sha256').update(body).digest('hex');
            const jwt=await core.getIDToken('https://oneil-control-desk.asura2367.chatgpt.site/api/release-evidence#sha256='+digest);
            const response=await fetch('https://oneil-control-desk.asura2367.chatgpt.site/api/release-evidence',{method:'POST',redirect:'manual',headers:{'OAI-Sites-Authorization':'Bearer '+process.env.SITE_ACCESS,'Content-Type':'application/json'},body:JSON.stringify({attestation:jwt,evidence:body}),signal:AbortSignal.timeout(30000)});
            if(!response.ok){let diagnostic='HTTP_'+response.status;try{const rejected=await response.json();if(/^[A-Z0-9_]{1,100}$/.test(rejected.diagnostic||''))diagnostic=rejected.diagnostic;}catch{}throw Error('EVIDENCE_PUBLISH_'+diagnostic);}
            core.info('Signed source/test evidence delivered; no orders or approvals changed.');

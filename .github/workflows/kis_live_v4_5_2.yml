name: Shared KIS Session (TOKEN CACHE ONLY)
on:
  workflow_dispatch:
  workflow_call:
    outputs:
      ready:
        description: 'Usable encrypted cache prepared; no token in outputs'
        value: ${{ jobs.prepare.outputs.ready }}
    secrets:
      KIS_APP_KEY:
        required: true
      KIS_APP_SECRET:
        required: true
      KIS_TOKEN_CACHE_KEY:
        required: true
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.cache.outputs.ready }}
    concurrency:
      group: kis-shared-token-cache
      cancel-in-progress: false
    env:
      LIVE_ENABLED: 'false'
      KIS_ALLOW_ORDER: 'false'
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_TOKEN_CACHE_KEY: ${{ secrets.KIS_TOKEN_CACHE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'cryptography>=42,<47'
      - name: Refresh ciphertext cache only, no market/account/order calls
        id: cache
        run: python collect_shared_token.py --prepare-only

name: Pre-send abort proof tests (ISOLATED DATABASE)
on:
  pull_request:
    paths:
      - 'v519_pre_send_review.py'
      - 'tests/test_v519_pre_send_review.py'
      - 'tests/test_v519_no_order_review.py'
      - 'tests/fixtures/pre_send_*'
      - '.github/workflows/v519-pre-send-review-tests.yml'
permissions:
  contents: read
jobs:
  isolated-pre-send-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: integration_test_only
          POSTGRES_DB: oneil_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      LIVE_ENABLED: 'false'
      KIS_ALLOW_ORDER: 'false'
      V519_TEST_DB_URL: postgresql://postgres:integration_test_only@127.0.0.1:5432/oneil_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'psycopg[binary]==3.2.9'
      - run: python -m unittest discover -s tests -p 'test_v519_pre_send_review.py' -v

name: V5.19 Integrated Engine (LIVE LOCKED)
on:
  pull_request:
    paths:
      - '**.py'
      - 'requirements.txt'
      - '.github/workflows/oneil_v519_live_engine_review.yml'
  push:
    branches: [main]
    paths:
      - 'oneil_v519_live_engine.py'
      - 'v519_pg_ledger.py'
      - 'tests/test_v519_live_engine.py'
      - '.github/workflows/oneil_v519_live_engine_review.yml'
  schedule:
    # KST 09:00–19:40 every 20 minutes; 20:00 closes new-order intake.
    # Read-only until a separately approved live release. Best-effort scheduling.
    - cron: '0,20,40 0-10 * * *'
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [observe, recover, halt, migrate, close]
        default: observe
        description: 'Live orders remain code-locked for every operation'
permissions:
  contents: read
concurrency:
  group: v519-integrated-${{ inputs.operation == 'halt' && 'emergency-halt' || (github.event_name == 'pull_request' && github.ref || 'account') }}
  cancel-in-progress: false
jobs:
  test:
    if: inputs.operation != 'halt'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: integration_test_only
          POSTGRES_DB: oneil_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      LIVE_ENABLED: 'false'
      KIS_ALLOW_ORDER: 'false'
      V519_TEST_DB_URL: postgresql://postgres:integration_test_only@127.0.0.1:5432/oneil_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'psycopg[binary]>=3.2,<4' 'cryptography>=42,<47'
      - name: Unit and real PostgreSQL recovery/concurrency tests
        run: python -m unittest discover -s tests -p 'test_v519_live_engine.py' -v
      - name: Existing KIS pagination and safety regression tests
        run: |
          python -m unittest discover -s tests -p 'test_v519_broker_recovery.py' -v
          python -m unittest discover -s tests -p 'test_v519_order_recovery.py' -v
          python -m unittest discover -s tests -p 'test_live_runner.py' -v
          python -m unittest discover -s tests -p 'test_v519_cash_sizing.py' -v
          python -m unittest -v test_v519_durable_submit test_v519_pipeline
      - name: Release lock resists all environment flags
        run: |
          if LIVE_ENABLED=true KIS_ALLOW_ORDER=true I_APPROVE_LIVE_KIS_ORDERS=YES python oneil_v519_live_engine.py --run --execute; then
            echo 'ERROR: live lock bypassed'; exit 1
          fi
          python - <<'PY'
          import json
          r=json.load(open('v5_19_report.json'))
          assert r['reason']=='RELEASE_LOCKED_PENDING_USER_APPROVAL' and r['orders_sent']==0
          PY
  observe:
    if: always() && github.event_name != 'pull_request' && (needs.test.result == 'success' || inputs.operation == 'halt')
    needs: test
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LIVE_ENABLED: 'false'
      KIS_ALLOW_ORDER: 'false'
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO }}
      KIS_ACCOUNT_PRODUCT: ${{ secrets.KIS_ACCOUNT_PRODUCT }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      OPERATION: ${{ github.event.schedule == '0 11 * * *' && 'close' || inputs.operation || 'observe' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Clear prior generated results
        run: rm -f v5_19_report.json data/live/dashboard.enc.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'psycopg[binary]>=3.2,<4' 'cryptography>=42,<47'
      - name: Deploy idempotent ledger migration on main update
        if: github.event_name == 'push'
        run: python oneil_v519_live_engine.py --migrate
      - name: Run existing integrated engine
        run: |
          rm -f data/live/dashboard.enc.json
          case "$OPERATION" in
            observe) python oneil_v519_live_engine.py --run --dashboard-public-key data/live/dashboard_public_key.pem ;;
            close) python oneil_v519_live_engine.py --close --dashboard-public-key data/live/dashboard_public_key.pem ;;
            recover) python oneil_v519_live_engine.py --recover ;;
            halt) python oneil_v519_live_engine.py --halt ;;
            migrate) python oneil_v519_live_engine.py --migrate ;;
            *) exit 2 ;;
          esac
      - name: Publish encrypted private-dashboard snapshot
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const publish = async (path, raw, message) => {
              let sha;
              try { sha = (await github.rest.repos.getContent({...context.repo, path, ref:'main'})).data.sha; }
              catch(e) { if(e.status !== 404) throw e; }
              await github.rest.repos.createOrUpdateFileContents({...context.repo,path,branch:'main',sha,message,content:Buffer.from(raw).toString('base64')});
            };
            const path = 'data/live/dashboard.enc.json';
            if(fs.existsSync(path)) {
              const raw=fs.readFileSync(path,'utf8'); const envelope=JSON.parse(raw);
              if(envelope.algorithm!=='RSA-OAEP-256+A256GCM'||!envelope.ciphertext||!envelope.wrapped_key)throw new Error('Invalid encrypted snapshot');
              await publish(path,raw,'Update encrypted V5.19 dashboard snapshot [skip ci]');
            }
            let result={status:'NO_RESULT'};
            if(fs.existsSync('v5_19_report.json'))result=JSON.parse(fs.readFileSync('v5_19_report.json','utf8'));
            const blocked=String(result.status).includes('BLOCKED')||result.scanner_status==='BLOCKED_INVALID_OR_STALE_SOURCE';
            const status={schema_version:1,run_id:context.runId,updated_at:new Date().toISOString(),event:context.eventName,
              conclusion:blocked||result.status==='NO_RESULT'?'failure':'success',status:result.status,
              url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`};
            await publish('data/live/dashboard_status.json',JSON.stringify(status),'Update sanitized V5.19 runtime status [skip ci]');
      - name: Save sanitized result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v519-integrated-result-${{ github.run_id }}
          path: v5_19_report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Record workflow summary
        if: always()
        run: |
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('v5_19_report.json')
          r=json.loads(p.read_text()) if p.exists() else {'status':'NO_RESULT','orders_sent':0}
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('V5.19 live orders locked\n\n```json\n'+json.dumps(r,ensure_ascii=False,indent=2)+'\n```\n')
          PY

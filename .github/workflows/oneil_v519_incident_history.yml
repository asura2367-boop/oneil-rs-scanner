name: Incident history evidence (NO ORDERS)
on:
  pull_request:
    paths:
      - 'oneil_v519_incident_history.py'
      - 'tests/test_v519_incident_history.py'
      - '.github/workflows/oneil_v519_incident_history.yml'
  workflow_dispatch:
    inputs:
      day:
        description: 'Incident date in KST (YYYY-MM-DD), NOT today; 1-89 days ago. For the Nov 4 incident: 2026-11-04'
        required: true
        type: string
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: isolated-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      INCIDENT_TEST_DB_URL: postgresql://postgres:isolated-test-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - run: python -m unittest discover -s tests -p test_v519_incident_history.py -v
  observe:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      LIVE_ENABLED: 'false'
      KIS_ALLOW_ORDER: 'false'
      INCIDENT_DAY: ${{ inputs.day }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO }}
      KIS_ACCOUNT_PRODUCT: ${{ secrets.KIS_ACCOUNT_PRODUCT }}
      KIS_TOKEN_CACHE_KEY: ${{ secrets.KIS_TOKEN_CACHE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'psycopg[binary]>=3.2,<4' 'cryptography>=42,<47'
      - name: Read closed-day evidence with existing token only
        run: python oneil_v519_incident_history.py --day "$INCIDENT_DAY"

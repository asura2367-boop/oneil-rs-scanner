name: V5.19 KIS to Supabase reconciliation (NO ORDERS)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v519-kis-pg-sync
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO }}
      KIS_ACCOUNT_PRODUCT: ${{ secrets.KIS_ACCOUNT_PRODUCT }}
      LIVE_ENABLED: 'false'
      KIS_ALLOW_ORDER: 'false'
      I_APPROVE_LIVE_KIS_ORDERS: 'NO'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'psycopg[binary]==3.2.9'
      - name: Sync existing broker fills into durable ledger
        run: python v519_kis_pg_sync.py

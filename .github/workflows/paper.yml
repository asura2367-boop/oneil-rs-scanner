name: Oneil RS Paper Trading Only
on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1-5' # 21:00 KST weekdays
permissions:
  contents: write
concurrency:
  group: oneil-paper-only
  cancel-in-progress: false
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install paper engine dependencies
        run: python -m pip install pandas numpy
      - name: Run read-only paper simulation
        run: python paper_trade.py
      - name: Build pending orders and performance report
        run: python paper_enrich.py
      - name: Commit paper-only records
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/paper/
          if ! git diff --cached --quiet; then
            git commit -m 'Update paper-only simulation'
            git pull --rebase origin main
            git push
          fi

name: V4-A Intraday Quotes (experimental)

on:
  workflow_dispatch:
  # Automatic duplicate quote collection retired; manual diagnostics only.

permissions:
  contents: write

concurrency:
  group: kis-v4a-intraday
  cancel-in-progress: false

jobs:
  collect-quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_TOKEN_CACHE_KEY: ${{ secrets.KIS_TOKEN_CACHE_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requests
        run: python -m pip install requests 'cryptography>=42,<47'
      - name: Collect 5-minute snapshots for at most 55 minutes
        shell: bash
        run: |
          python - <<'PY'
          import time
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          from quote_collector_v4a import QuoteClient, collect, regular_session

          zone = ZoneInfo('Asia/Seoul')
          client = QuoteClient()
          tickers = ['005930', '022220', '024950']
          deadline = time.monotonic() + 55 * 60
          last_slot = None
          try:
              while time.monotonic() < deadline:
                  now = datetime.now(zone)
                  slot = now.strftime('%Y-%m-%d %H:%M')
                  # No off-hours requests; no assumption that weekdays are exchange days.
                  if regular_session(now) and now.minute % 5 == 0 and slot != last_slot:
                      last_slot = slot
                      print('Snapshot slot:', slot, flush=True)
                      collect(client, tickers)
                  if now.hour > 15 or (now.hour == 15 and now.minute > 20):
                      break
                  time.sleep(10)
          finally:
              client.close()
          PY
      - name: Commit only intraday quote snapshots
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data/intraday_v4a/quotes_*.csv 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Save experimental V4-A intraday snapshots'
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo 'No new quote snapshots'
          fi

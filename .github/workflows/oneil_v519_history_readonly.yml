name: Oneil V5.19 KIS Order History Read-only (NO ORDERS)
on:
  workflow_dispatch:
    inputs:
      broker_read:
        description: 'Read KIS daily order history without placing orders'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      LIVE_ENABLED: 'false'
      KIS_ALLOW_ORDER: 'false'
      BROKER_READ: ${{ inputs.broker_read }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO }}
      KIS_ACCOUNT_PRODUCT: ${{ secrets.KIS_ACCOUNT_PRODUCT }}
      KIS_TOKEN_CACHE_KEY: ${{ secrets.KIS_TOKEN_CACHE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install cache dependency
        run: python -m pip install cryptography
      - name: Run order history safety tests
        run: python -m unittest -v tests/test_v519_history_observe.py
      - name: Refresh ephemeral token for read-only observation
        shell: bash
        run: |
          if [ "$BROKER_READ" = 'true' ]; then
            python oneil_v519_token_bootstrap.py --broker-read
          else
            python oneil_v519_token_bootstrap.py
          fi
      - name: Observe order history WITHOUT orders
        shell: bash
        run: |
          if [ "$BROKER_READ" = 'true' ]; then
            python oneil_v519_history_observe.py --broker-read --output v5_19_history_observe.json
          else
            python oneil_v519_history_observe.py --output v5_19_history_observe.json
          fi
          python - <<'PY'
          import json
          a=json.load(open('v5_19_history_observe.json',encoding='utf8'))
          assert a['gate']=='DENY' and a['orders_sent']==0
          assert a['independent_reconciliation_verified'] is False
          print('HISTORY_SAFETY=DENY; orders_sent=0')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v519-history-observation-no-orders
          path: v5_19_history_observe.json
          retention-days: 3

name: Paper after verified data collection (NO ORDERS)

on:
  workflow_run:
    workflows: ["Update RS data and investor flow V9"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-state-serial
  cancel-in-progress: false

jobs:
  paper-after-collection:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Paper dependencies
        run: python -m pip install pandas numpy
      - name: Check confirmed trading date and pending prices, then simulate (NO ORDERS)
        env:
          PAPER_RESERVE_PCT: '40'
          PAPER_STOCK_PCT: '30'
          LIVE_ENABLED: 'false'
          KIS_ALLOW_ORDER: 'false'
        run: python paper_trade.py
      - name: Persist paper-only records
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/paper/
          if ! git diff --cached --quiet; then
            git commit -m 'Paper trading after successful daily collection'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

name: V4-C Multi-day Isolated Tests
on:
  workflow_dispatch:
  push:
    paths:
      - 'paper_v4c.py'
      - 'test_v4c_multiday.py'
      - '.github/workflows/v4c_multiday_test.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run isolated multi-day paper tests
        run: python -m unittest -v test_v4c_multiday

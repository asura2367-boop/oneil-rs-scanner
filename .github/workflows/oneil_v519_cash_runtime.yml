name: Oneil V5.19 Cash Runtime Observation (NO ORDERS)
on:
  workflow_dispatch:
    inputs:
      broker_read:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      LIVE_ENABLED: 'false'
      KIS_ALLOW_ORDER: 'false'
      BROKER_READ: ${{ inputs.broker_read }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO }}
      KIS_ACCOUNT_PRODUCT: ${{ secrets.KIS_ACCOUNT_PRODUCT }}
      KIS_TOKEN_CACHE_KEY: ${{ secrets.KIS_TOKEN_CACHE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install encryption dependency
        run: python -m pip install cryptography
      - name: Cash runtime tests
        run: python -m unittest -v tests.test_v519_cash_runtime
      - name: Read-only KIS authentication
        run: |
          if [ "$BROKER_READ" = 'true' ]; then
            python oneil_v519_token_bootstrap.py --broker-read
          else
            python oneil_v519_token_bootstrap.py
          fi
      - name: Build same-run review candidates
        run: |
          rm -f v5_9_candidates_review.json v5_11_review.json
          python oneil_live_v5_9.py --output v5_9_candidates_review.json
          python oneil_live_v5_11.py --candidates v5_9_candidates_review.json --output v5_11_review.json
      - name: Read only broker cash and indicative buying power
        run: |
          rm -f v5_19_cash_runtime.json
          if [ "$BROKER_READ" = 'true' ]; then
            python oneil_v519_cash_runtime.py --broker-read
          else
            python oneil_v519_cash_runtime.py
          fi
      - name: Assert no orders
        run: |
          python - <<'PY'
          import json
          x=json.load(open('v5_19_cash_runtime.json',encoding='utf8'))
          assert x['gate']=='DENY' and x['orders_sent']==0 and x['broker_order_api_calls']==0
          print('CASH_RUNTIME=SAFE_DENY; orders_sent=0')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v519-cash-runtime-no-orders
          path: v5_19_cash_runtime.json
          if-no-files-found: warn
          retention-days: 3

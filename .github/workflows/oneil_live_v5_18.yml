name: Oneil V5.18 Session and Quote Diagnostics (NO ORDERS)
on:
  workflow_dispatch:
    inputs:
      network:
        description: 'Read-only WebSocket test; no real orders'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: oneil-v5-18
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LIVE_ENABLED: 'false'
      KIS_ALLOW_ORDER: 'false'
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      NETWORK: ${{ inputs.network }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only libraries
        run: python -m pip install requests websockets
      - name: Test session and duplicate checks
        run: python -m unittest discover -s tests -p 'test_oneil_v5_18.py' -v
      - name: Inspect WebSocket frames without orders
        run: |
          if [ "$NETWORK" = 'true' ]; then
            python oneil_live_v5_18.py --network --seconds 12
          else
            python oneil_live_v5_18.py
          fi
      - name: Upload sanitized statuses only
        uses: actions/upload-artifact@v4
        with:
          name: v5-18-no-order-review
          path: v5_18_report.json
          retention-days: 3

name: Update KIS Investor Flow
on:
  workflow_dispatch:
  schedule:
    - cron: '10 10 * * 1-5' # 19:10 KST weekdays; UTC
permissions:
  contents: write
concurrency:
  group: kis-investor-flow
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_FLOW_BATCH_SIZE: '20'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas requests
      - name: Collect investor flow
        run: python build_investor.py
      - name: Commit flow data
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f data/kis_investor_flow.csv ]; then
            git add data/kis_investor_flow.csv
            if ! git diff --cached --quiet; then
              git commit -m 'Update KIS investor flow'
              git pull --rebase origin main
              git push
            fi
          fi

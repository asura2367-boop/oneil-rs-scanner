name: V5.19 candidate-to-KIS-to-Supabase pipeline (NO ORDERS)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO }}
      KIS_ACCOUNT_PRODUCT: ${{ secrets.KIS_ACCOUNT_PRODUCT }}
      LIVE_ENABLED: 'false'
      KIS_ALLOW_ORDER: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'psycopg[binary]==3.2.9'
      - run: python -m unittest test_v519_pipeline.py -v
      - name: Require fresh candidate report from this run
        run: |
          test -f v5_10_report.json || { echo 'No same-run candidate report: refusing to use stale data'; exit 2; }
          python v519_pipeline.py --report v5_10_report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v519-pipeline-result
          path: v519_pipeline_result.json
          if-no-files-found: ignore

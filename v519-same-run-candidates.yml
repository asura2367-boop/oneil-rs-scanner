name: V5.19 same-run scanner to candidate review (NO ORDERS)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v519-same-run-candidates
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LIVE_ENABLED: 'false'
      KIS_ALLOW_ORDER: 'false'
      I_APPROVE_LIVE_KIS_ORDERS: 'NO'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scanner dependencies
        run: python -m pip install pandas numpy
      - name: Build fresh candidates from existing price and investor CSV
        run: |
          set -euo pipefail
          DAY="$(TZ=Asia/Seoul date +%F)"
          echo "TRADE_DAY=$DAY" >> "$GITHUB_ENV"
          python build_v4b_candidates.py --date "$DAY" --output "$RUNNER_TEMP/v519-candidates.csv" --diagnostics "$RUNNER_TEMP/v519-diagnostics.json"
      - name: Forward same-run candidates to V5.19 review
        run: |
          python v519_same_run_candidates.py --csv "$RUNNER_TEMP/v519-candidates.csv" --date "$TRADE_DAY" --output v519_same_run_result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v519-same-run-candidate-review
          path: v519_same_run_result.json
          if-no-files-found: ignore
